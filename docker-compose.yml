name: english-prompt-evaluation

services:
  app:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    user: "${PROMPT_EVOLUTION_UID:-1000}:${PROMPT_EVOLUTION_GID:-1000}"
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATA_DISPLAY_PATH: ${PROMPT_EVOLUTION_DATA_DIR:-./.data}/local.db
      DATABASE_URL: file:/data/local.db
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      WEB_DIST_PATH: ../web/dist
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - type: bind
        source: ${PROMPT_EVOLUTION_DATA_DIR:-./.data}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
